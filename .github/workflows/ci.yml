name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.20.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        shell: bash
        run: for f in src/*.mjs; do node --check "$f"; done

      - name: Mirror self-test
        run: npm run selftest

      - name: Publisher self-test
        run: npm run publish-selftest

      - name: Lock self-test
        run: npm run lock-selftest

      - name: Runtime paths and migration self-test
        run: npm run runtime-paths-selftest

      - name: Runtime schema, atomic persistence, and initialization-lock self-test
        run: npm run runtime-foundation-selftest

      - name: Desktop backend contract self-test
        run: npm run desktop-backend-selftest

      - name: Desktop settings contract and mirror relocation self-test
        run: npm run desktop-settings-selftest

      - name: Chromium browser discovery and compatibility self-test
        run: npm run browser-selftest

      - name: Explicit source-checkout import self-test
        run: npm run source-import-selftest

      - name: Institution authentication security self-test
        run: npm run auth-selftest

      - name: Scheduled sync policy and logging self-test
        run: npm run schedule-selftest

      - name: School indexes self-test
        run: npm run school-indexes-selftest

      - name: Deadline intelligence self-test
        run: npm run deadline-intelligence-selftest

      - name: Asset index self-test
        run: npm run asset-index-selftest

      - name: Write-protection self-test
        run: npm run write-protection-selftest

      - name: Security self-test
        run: npm run security-selftest

      - name: Windows installer foundation self-test
        run: npm run installer-foundation-selftest

      - name: Windows installer lifecycle contract self-test
        run: npm run installer-lifecycle-selftest

      - name: Update-check contract self-test
        run: npm run update-check-selftest

      - name: Official release-pipeline contract self-test
        run: npm run release-pipeline-selftest

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  history-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan full Git history for sensitive material
        run: npm run history-security-selftest

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        shell: pwsh
        run: Get-ChildItem src\*.mjs | ForEach-Object { node --check $_.FullName }

      - name: Runtime paths and migration self-test
        run: npm run runtime-paths-selftest

      - name: Runtime schema, atomic persistence, and initialization-lock self-test
        run: npm run runtime-foundation-selftest

      - name: Desktop settings contract and mirror relocation self-test
        run: npm run desktop-settings-selftest

      - name: Chromium browser discovery and compatibility self-test
        run: npm run browser-selftest

      - name: Explicit source-checkout import self-test
        run: npm run source-import-selftest

      - name: Institution authentication security self-test
        run: npm run auth-selftest

      - name: Scheduled sync policy and logging self-test
        run: npm run schedule-selftest

      - name: Windows environment doctor
        run: npm run doctor

      - name: Launch installed Chromium with persistent Playwright profile
        run: npm run windows-browser-smoke

      - name: Write-protection self-test
        run: npm run write-protection-selftest

      - name: Security self-test
        run: npm run security-selftest

  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup supported Node.js build environment
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install locked build dependencies without browsers
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build portable Windows application bundle
        run: npm run build:windows-bundle

      - name: Verify compiled update checker without live API access
        run: npm run update-check-selftest -- --require-built

      - name: Verify private runtime and source-checkout independence
        run: npm run windows-bundle-selftest

      - name: Verify installer lifecycle and maintenance commands
        run: npm run installer-lifecycle-selftest

      - name: Verify installer source and failure contracts
        run: npm run installer-foundation-selftest

      - name: Provision verified Inno Setup 7.1.0 x64
        shell: pwsh
        run: .\scripts\provision-inno-setup-ci.ps1

      - name: Build Windows development installer
        run: npm run build:windows-installer

      - name: Independently verify installer artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "CourseMirror-$version-Setup.exe"
          $installer = Join-Path $PWD "dist\installer\$name"
          $sidecar = "$installer.sha256"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer is missing: $installer" }
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) { throw "Checksum is missing: $sidecar" }
          $actualSha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = "$actualSha  $name"
          if ((Get-Content -LiteralPath $sidecar -Raw) -cne $expectedLine) { throw 'Installer checksum sidecar is invalid.' }
          $actualVersion = [Version](Get-Item -LiteralPath $installer).VersionInfo.ProductVersion
          $expectedVersion = [Version]$version
          if ($actualVersion.Major -ne $expectedVersion.Major -or
              $actualVersion.Minor -ne $expectedVersion.Minor -or
              $actualVersion.Build -ne $expectedVersion.Build) {
            throw "Installer product version mismatch: expected $version, found $actualVersion."
          }

      - name: Upload development installer for review
        uses: actions/upload-artifact@v4
        with:
          name: coursemirror-installer-development
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 7
